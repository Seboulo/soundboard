[package]
name = "soundboard"
version = "0.10.0"
description = "Soundboard pour Discord : joue des sons dans ton micro via un câble audio virtuel"
authors = ["Sébastien"]
license = "MIT"
homepage = "https://github.com/Seboulo/soundboard"
repository = "https://github.com/Seboulo/soundboard"
edition = "2021"

[lib]
name = "soundboard_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
nnnoiseless = { version = "0.5", default-features = false }
symphonia = { version = "0.5", features = ["all"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
# Vitesse plutôt que taille : le micro est filtré en temps réel.
opt-level = 3
strip = true
