name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Sur un tag vX.Y.Z, ou un commit de main dont le message contient
      # [release] : crée la release GitHub vX.Y.Z (version de tauri.conf.json).
      - name: Build et release
        if: env.RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Soundboard v__VERSION__
          releaseBody: |
            Télécharge `Soundboard_..._x64-setup.exe` ci-dessous et lance-le.
            Au premier lancement, l'assistant t'aide à installer VB-Cable et à régler Discord.
          releaseDraft: false

      # Sinon : simple build, installeur disponible dans les artefacts du run.
      - name: Build
        if: env.RELEASE != 'true'
        run: npm run build

      - name: Installeur en artefact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
