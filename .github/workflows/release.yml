name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Clé qui signe les mises à jour en un clic (secret du dépôt). Sans
      # elle, on construit quand même l'installeur, sans mise à jour intégrée.
      - name: Clé de signature des mises à jour
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<EOF_KEY"
              echo "$KEY"
              echo "EOF_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
              echo "BUILD_ARGS="
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY absent : pas de mise à jour en un clic pour cette version."
            echo 'BUILD_ARGS=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      # Sur un tag vX.Y.Z, ou un commit de main dont le message contient
      # [release] : crée la release GitHub vX.Y.Z (version de tauri.conf.json).
      - name: Build et release
        if: env.RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Soundboard v__VERSION__
          releaseBody: |
            Télécharge `Soundboard_..._x64-setup.exe` ci-dessous et lance-le (déjà installée : bouton « Mettre à jour » dans l'app).
            Au premier lancement, l'assistant t'aide à installer VB-Cable et à régler Discord.

            Nouveautés de la 1.0 :
            - Volume des sons égalisé comme à la télé (norme EBU R128), niveau réglable, compresseur et limiteur contre les cris et les pics.
            - Antibruit du micro par IA (DeepFilterNet), porte de voix plus intelligente, voix sans micro-coupures.
            - Images de memes : emoji choisi d'après le nom du son, GIF GIPHY avec une clé gratuite, ou ta propre image.
            - Diagnostic en un clic et « Écouter comme Discord ».
            - Statistiques : sons les plus joués, temps joué, sons jamais joués.
            - Réglages en onglets et nouveau look plus lisible.
            - Overlay en jeu retiré.
          releaseDraft: false
          args: ${{ env.BUILD_ARGS }}

      # Sinon : simple build, installeur disponible dans les artefacts du run.
      - name: Build
        if: env.RELEASE != 'true'
        shell: bash
        run: npm run build -- $BUILD_ARGS

      - name: Installeur en artefact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
