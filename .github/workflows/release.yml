name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Clé qui signe les mises à jour (secret du dépôt). Sans elle,
      # l'app refuserait d'installer les nouvelles versions.
      - name: Clé de signature
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      # Sur un tag vX.Y.Z : crée une release GitHub avec l'installeur.
      - name: Build et release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Soundboard ${{ github.ref_name }}
          releaseBody: |
            Télécharge `Soundboard_..._x64-setup.exe` ci-dessous et lance-le.
            Au premier lancement, l'assistant t'aide à installer VB-Cable et à régler Discord.
          releaseDraft: false

      # Sinon : simple build, installeur disponible dans les artefacts du run.
      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run build

      - name: Installeur en artefact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
