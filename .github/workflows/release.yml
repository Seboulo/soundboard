name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Clé qui signe les mises à jour en un clic (secret du dépôt). Sans
      # elle, on construit quand même l'installeur, sans mise à jour intégrée.
      - name: Clé de signature des mises à jour
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<EOF_KEY"
              echo "$KEY"
              echo "EOF_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
              echo "BUILD_ARGS="
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY absent : pas de mise à jour en un clic pour cette version."
            echo 'BUILD_ARGS=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      # Sur un tag vX.Y.Z, ou un commit de main dont le message contient
      # [release] : crée la release GitHub vX.Y.Z (version de tauri.conf.json).
      - name: Notes de version
        id: notes
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          {
            echo 'body<<EOF_NOTES'
            cat NOUVEAUTES.md
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build et release
        if: env.RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Soundboard v__VERSION__
          # Texte de la page de version : fichier NOUVEAUTES.md à la racine.
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          args: ${{ env.BUILD_ARGS }}

      # Sinon : simple build, installeur disponible dans les artefacts du run.
      - name: Build
        if: env.RELEASE != 'true'
        shell: bash
        run: npm run build -- $BUILD_ARGS

      - name: Installeur en artefact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Commit sur main avec [notes] (sans [release]) : la page de la version
  # actuelle reprend le texte de NOUVEAUTES.md, sans republier.
  notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[notes]') && !contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour le texte de la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file NOUVEAUTES.md
          else
            echo "Pas encore de version v$VERSION : rien à mettre à jour."
          fi
